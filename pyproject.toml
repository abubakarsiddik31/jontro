[project]
name = "jontro"
version = "2.0.0"
description = "Code for Jontro: a multi-turn Bangla and Banglish tool-use corpus and benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Abu Bakar Siddik" },
    { name = "Afroza Islam" },
    { name = "Sarafat Hussain Abhi" },
]
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.6",
    "huggingface_hub>=0.24",
    "pyyaml>=6.0",
    "rich>=13.7",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "jsonschema>=4.20",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Dataset = "https://huggingface.co/datasets/abubakar-siddik/Jontro"
Code = "https://github.com/abubakarsiddik31/jontro"

[project.scripts]
bangla-datasets = "bangla_datasets.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bangla_datasets"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
